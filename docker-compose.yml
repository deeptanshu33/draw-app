services:
  postgres:
    image: postgres:16-alpine
    container_name: drawapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drawapp
      POSTGRES_PASSWORD: drawapp
      POSTGRES_DB: drawapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawapp -d drawapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
